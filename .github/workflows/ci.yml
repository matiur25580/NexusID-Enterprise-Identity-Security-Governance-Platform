name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexusid
          POSTGRES_PASSWORD: nexusid
          POSTGRES_DB: nexusid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusid -d nexusid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nexusid:nexusid@localhost:5432/nexusid?schema=public
      AUTH_SECRET: ci-only-not-a-production-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Prepare integration database
        run: pnpm db:push

      - name: Apply tenant relational integrity constraints
        run: psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f apps/web/prisma/migrations/20261121170000_add_tenant_relational_integrity/migration.sql

      - name: Prepare tenant RLS policies (not activated)
        run: psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f apps/web/prisma/migrations/20261121180000_prepare_tenant_rls_policies/migration.sql

      - name: README dashboard image integrity
        run: pnpm test:readme-images

      - name: Policy regression tests
        run: pnpm test:policy

      - name: Risk alert regression tests
        run: pnpm test:risk-alerts

      - name: Lifecycle regression tests
        run: pnpm test:lifecycle

      - name: SCIM protocol regression tests
        run: pnpm test:scim

      - name: SCIM Groups regression tests
        run: pnpm test:scim-groups

      - name: Tenant isolation integration tests
        run: pnpm test:integration
        env:
          NEXUSID_INTEGRATION_TEST: "1"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
